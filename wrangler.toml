name = "ntuthukobiz-website"
main = "_worker.js"
compatibility_date = "2026-06-16"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "INTAKE_DB"
database_name = "ntuthukobiz_forms"
database_id = "ac2783ee-2aee-40f1-984d-8bfb56b13c64"

[[r2_buckets]]
binding = "INTAKE_FILES"
bucket_name = "ntuthukobiz-intake-files"
